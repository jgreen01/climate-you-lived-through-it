<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Warming globe">
  <defs>
    <!-- Same warming ramp as the map: pale yellow -> orange -> red -> deep magma -->
    <linearGradient id="heat" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fcdf96"/>
      <stop offset="0.45" stop-color="#f0824d"/>
      <stop offset="0.8" stop-color="#c0392b"/>
      <stop offset="1" stop-color="#6a1b5a"/>
    </linearGradient>
  </defs>
  <circle cx="32" cy="32" r="30" fill="url(#heat)"/>
  <!-- Globe grid: equator, two latitudes, and a meridian ellipse -->
  <g fill="none" stroke="#ffffff" stroke-opacity="0.55" stroke-width="1.6">
    <circle cx="32" cy="32" r="29"/>
    <ellipse cx="32" cy="32" rx="12" ry="29"/>
    <line x1="3" y1="32" x2="61" y2="32"/>
    <line x1="7" y1="17" x2="57" y2="17"/>
    <line x1="7" y1="47" x2="57" y2="47"/>
  </g>
</svg>
